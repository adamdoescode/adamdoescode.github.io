---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% if page.date %}
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%e %B %Y" }}
      </time>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<nav class="post-navigation" aria-label="Blog navigation">
  <a href="{{ '/blog/' | relative_url }}">← All posts</a>
</nav>
